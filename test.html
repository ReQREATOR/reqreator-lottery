<html lang="ja">

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      background: #f7f5f0;

      color: #b87832;

      margin-top: 18px;

      text-align: left;
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">Re:QREATOR</div>

    <h1>プレゼント抽選</h1>

    <p>会員名を入力して、抽選にご参加ください。</p>

    <form
      id="drawForm"
      method="post"
      action="https://script.google.com/macros/s/AKfycbzCvXCrrRVTd9asGKntuhjfCd3qCXJtXPXNLRivMoAwRhEh_zyv3RV1ixGsd4JuBxylmg/exec"
    >
      <label for="memberName">会員名</label>

      <input
        type="text"
        name="memberName"
        id="memberName"
        maxlength="80"
        autocomplete="name"
        placeholder="例：山田 花子"
        required
      >

      <input type="hidden" name="idToken" id="idToken">

      <button id="drawButton" type="submit" disabled>
        LINE認証中…
      </button>
    </form>

    <p id="status" aria-live="polite">
      LINEの認証を確認しています。
    </p>

    <p class="note">
      ※抽選はお一人様1回限りです。同じLINEアカウントで再アクセスした場合は、初回の抽選結果を表示します。
    </p>
  </main>

  <script>
    const LIFF_ID = "1656435814-rLbpktXX";

    const form = document.getElementById("drawForm");
    const memberNameInput = document.getElementById("memberName");
    const idTokenInput = document.getElementById("idToken");
    const drawButton = document.getElementById("drawButton");
    const statusElement = document.getElementById("status");

    let liffReady = false;
    let submitting = false;
    let reloginStarted = false;

    // IDトークンの有効期限を確認する。
    // 期限まで2分未満の場合も再ログインを促す。
    function isTokenExpired(token) {
      try {
        const parts = token.split(".");
        if (parts.length !== 3) return true;

        const payload = parts[1]
          .replace(/-/g, "+")
          .replace(/_/g, "/");

        const padded = payload + "=".repeat((4 - payload.length % 4) % 4);
        const claims = JSON.parse(atob(padded));

        if (!claims.exp) return true;

        return Date.now() >= (claims.exp * 1000) - 120000;
      } catch (error) {
        return true;
      }
    }

    // 期限切れトークンが使われている場合、LINEに再ログインする。
    function restartLineLogin(message) {
      if (reloginStarted) return;

      reloginStarted = true;
      liffReady = false;
      drawButton.disabled = true;
      drawButton.textContent = "LINE再認証中…";
      statusElement.textContent = message;

      try {
        liff.logout();
      } catch (error) {
        console.error("LIFF logout error:", error);
      }

      liff.login({
        redirectUri: window.location.href
      });
    }

    async function initializeLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          statusElement.textContent =
            "LINEのログイン画面に移動します。";

          liff.login({
            redirectUri: window.location.href
          });
          return;
        }

        const idToken = liff.getIDToken();

        if (!idToken) {
          statusElement.textContent =
            "LINE認証情報を取得できませんでした。LINEから開き直してください。";
          return;
        }

        if (isTokenExpired(idToken)) {
          restartLineLogin(
            "認証情報の期限を確認しました。LINEに再ログインします。"
          );
          return;
        }

        idTokenInput.value = idToken;
        liffReady = true;
        drawButton.disabled = false;
        drawButton.textContent = "抽選する";

        statusElement.textContent =
          "会員名を入力して「抽選する」を押してください。";

      } catch (error) {
        console.error("LIFF initialization error:", error);
        statusElement.textContent =
          "LINE認証に失敗しました。ページを開き直してください。";
      }
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (submitting) return;

      const memberName = memberNameInput.value.trim();

      if (!memberName) {
        statusElement.textContent = "会員名を入力してください。";
        memberNameInput.focus();
        return;
      }

      if (!liffReady || !liff.isLoggedIn()) {
        statusElement.textContent =
          "LINE認証が完了していません。ページを開き直してください。";
        return;
      }

      // 抽選ボタンを押した時点でIDトークンを取得し直す。
      const currentToken = liff.getIDToken();

      if (!currentToken || isTokenExpired(currentToken)) {
        restartLineLogin(
          "認証情報の期限切れを確認しました。LINEに再ログインします。"
        );
        return;
      }

      idTokenInput.value = currentToken;
      memberNameInput.value = memberName;

      submitting = true;
      drawButton.disabled = true;
      drawButton.textContent = "処理中…";
      statusElement.textContent =
        "抽選結果を確認しています。画面を閉じずにお待ちください。";

      // 通常のフォーム送信でGASへ渡す。
      form.submit();
    });

    initializeLiff();
  </script>
</body>
</html>
