
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f4eb">
  <title>Re:QREATOR 5周年記念プレゼント抽選</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --ivory: #f8f4eb;
      --paper: #fffdf8;
      --gold: #c6a76b;
      --gold-light: #f2e4c2;
      --gold-dark: #92713e;
      --ink: #393126;
      --muted: #817667;
      --border: #e5d7bc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px 36px;
      color: var(--ink);
      font-family:
        -apple-system, BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background:
        radial-gradient(ellipse at 50% 0%, #fffefa 0%, transparent 65%),
        linear-gradient(145deg, #f8f4eb, #f0e7d6);
    }

    main {
      position: relative;
      max-width: 460px;
      margin: 18px auto;
      padding: 35px 25px 28px;
      overflow: hidden;
      text-align: center;
      background: rgba(255,253,248,.97);
      border: 1px solid var(--border);
      border-radius: 3px;
      box-shadow: 0 14px 40px rgba(89,68,35,.09);
    }

    main::before {
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(198,167,107,.28);
      content: "";
      pointer-events: none;
    }

    main > * {
      position: relative;
    }

    .brand {
      color: #77613e;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
      letter-spacing: 4px;
    }

    .anniversary {
      margin-top: 25px;
      color: var(--gold-dark);
      font-family: Georgia, serif;
      font-size: 11px;
      letter-spacing: 4px;
    }

    .number-five {
      margin: 4px 0 -3px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(78px, 20vw, 108px);
      font-weight: 400;
      line-height: 1.08;
      background: linear-gradient(
        125deg,
        #987442 0%,
        #e6d09d 23%,
        #b28b4d 44%,
        #f0e2bc 59%,
        #9c7740 82%,
        #d9bd82 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(1px 2px 0 rgba(177,140,75,.12));
    }

    h1 {
      margin: 10px 0 21px;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 2px;
    }

    .intro {
      font-size: 13px;
      line-height: 2;
    }

    .divider {
      width: 46px;
      height: 1px;
      margin: 23px auto;
      background: linear-gradient(
        90deg, transparent, var(--gold), transparent
      );
    }

    label {
      display: block;
      margin: 25px 0 9px;
      text-align: left;
      font-size: 14px;
      font-weight: 600;
    }

    input[type="text"] {
      display: block;
      width: 100%;
      min-height: 50px;
      padding: 12px;
      border: 1px solid #d9cbb4;
      border-radius: 2px;
      background: #fff;
      color: var(--ink);
      font-size: 16px;
      appearance: none;
    }

    input[type="text"]:focus {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    button {
      display: block;
      width: 100%;
      min-height: 54px;
      margin-top: 22px;
      padding: 13px;
      border: 1px solid #a88a54;
      border-radius: 2px;
      background: linear-gradient(
        110deg, #40372a 0%, #665137 50%, #40372a 100%
      );
      color: #fffdf8;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow:
        0 5px 13px rgba(74,54,26,.13),
        inset 0 1px 0 rgba(255,255,255,.15);
      transition: opacity .2s, transform .2s;
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: .58;
      cursor: not-allowed;
    }

    #status {
      margin-top: 17px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .note {
      margin-top: 24px;
      color: #81796e;
      font-size: 11px;
      line-height: 1.9;
      text-align: left;
    }

    /* 抽選時の全画面演出 */
    #opening {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      padding: 20px;
      overflow: hidden;
      background:
        radial-gradient(
          ellipse at 50% 38%,
          #fffefa 0%,
          #f8f1e2 55%,
          #ecdfc7 100%
        );
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .35s ease, visibility .35s ease;
    }

    #opening.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #opening::before {
      position: absolute;
      inset: 15px;
      border: 1px solid rgba(183,147,84,.28);
      content: "";
      pointer-events: none;
    }

    #opening::after {
      position: absolute;
      inset: 22px;
      border: 1px solid rgba(183,147,84,.12);
      content: "";
      pointer-events: none;
    }

    .opening-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      text-align: center;
    }

    .opening-brand {
      color: #76603d;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      letter-spacing: 4px;
      opacity: 0;
    }

    .opening-title {
      margin-top: 15px;
      color: #9c7a45;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 11px;
      letter-spacing: 4px;
      opacity: 0;
    }

    .gift-scene {
      position: relative;
      display: grid;
      width: 270px;
      height: 265px;
      margin: 12px auto 0;
      place-items: center;
      perspective: 850px;
    }

    .gift-glow {
      position: absolute;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(235,210,158,.7) 0%,
        rgba(235,210,158,.27) 35%,
        rgba(235,210,158,0) 72%
      );
      opacity: 0;
      transform: scale(.65);
    }

    .gift-shadow {
      position: absolute;
      left: 50%;
      bottom: 30px;
      width: 170px;
      height: 23px;
      border-radius: 50%;
      background: rgba(83,61,31,.2);
      filter: blur(12px);
      transform: translateX(-50%);
      transition: transform 1s, opacity 1s;
    }

    .gift {
      position: relative;
      width: 166px;
      height: 150px;
      margin-top: 26px;
      transform-style: preserve-3d;
      animation: giftFloat 4s ease-in-out infinite;
    }

    .gift-body {
      position: absolute;
      left: 8px;
      bottom: 0;
      width: 150px;
      height: 98px;
      overflow: hidden;
      border: 1px solid #b99a62;
      background: linear-gradient(
        110deg,
        #c6a76c 0%,
        #f4e7c9 24%,
        #e6d1a1 53%,
        #c6a267 100%
      );
      box-shadow:
        inset 7px 0 10px rgba(255,255,255,.18),
        inset -8px 0 10px rgba(111,79,34,.08),
        0 12px 22px rgba(137,104,49,.14);
    }

    .gift-body::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 63px;
      width: 24px;
      border-right: 1px solid rgba(151,111,52,.3);
      border-left: 1px solid rgba(255,255,255,.48);
      background: linear-gradient(
        90deg, #b28a49, #f8ebcb 40%, #d1b071 78%, #b28a49
      );
      content: "";
    }

    .gift-body::after {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 9px;
      background: linear-gradient(
        180deg, rgba(255,255,255,.42), transparent
      );
      content: "";
    }

    .gift-side-highlight {
      position: absolute;
      inset: 0 auto 0 25px;
      width: 18px;
      background: linear-gradient(
        90deg, transparent, rgba(255,255,255,.35), transparent
      );
    }

    .gift-lid {
      position: absolute;
      z-index: 3;
      top: 25px;
      left: 0;
      width: 166px;
      height: 30px;
      border: 1px solid #b99a62;
      background: linear-gradient(
        105deg,
        #c7a66a 0%,
        #f7ebce 25%,
        #e7d1a0 61%,
        #bd9859 100%
      );
      box-shadow:
        0 5px 8px rgba(91,66,30,.13),
        inset 0 2px 3px rgba(255,255,255,.55);
      transform-origin: 12% 100%;
    }

    .gift-lid::before {
      position: absolute;
      inset: 2px 0 auto;
      height: 1px;
      background: rgba(255,255,255,.5);
      content: "";
    }

    .gift-lid::after {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 70px;
      width: 24px;
      border-right: 1px solid rgba(151,111,52,.3);
      border-left: 1px solid rgba(255,255,255,.5);
      background: linear-gradient(
        90deg, #b28a49, #f8ebcb 40%, #d1b071 78%, #b28a49
      );
      content: "";
    }

    .gift-ribbon {
      position: absolute;
      z-index: 4;
      top: 0;
      left: 71px;
      width: 24px;
      height: 150px;
      border-right: 1px solid rgba(151,111,52,.25);
      border-left: 1px solid rgba(255,255,255,.5);
      background: linear-gradient(
        90deg, #ad8547, #f9ebc9 38%, #d7b576 75%, #ad8547
      );
      transform-origin: 50% 24%;
    }

    .gift-bow {
      position: absolute;
      z-index: 5;
      top: -6px;
      left: 56px;
      width: 54px;
      height: 29px;
      transform-origin: 50% 100%;
    }

    .gift-bow::before,
    .gift-bow::after {
      position: absolute;
      top: 0;
      width: 29px;
      height: 21px;
      border: 1px solid #ae8546;
      background: linear-gradient(
        135deg, #fff0cf 0%, #e2c58c 55%, #bd9658 100%
      );
      box-shadow: inset 2px 2px 3px rgba(255,255,255,.65);
      content: "";
    }

    .gift-bow::before {
      left: 0;
      border-radius: 85% 15% 70% 25%;
      transform: rotate(22deg);
    }

    .gift-bow::after {
      right: 0;
      border-radius: 15% 85% 25% 70%;
      transform: scaleX(-1) rotate(22deg);
    }

    .gift-knot {
      position: absolute;
      z-index: 6;
      top: 5px;
      left: 77px;
      width: 13px;
      height: 13px;
      border: 1px solid #ad8546;
      border-radius: 3px;
      background: linear-gradient(135deg, #fff0cc, #c19a5b);
      box-shadow: 0 1px 3px rgba(94,68,31,.15);
      transform: rotate(45deg);
    }

    .gift.open {
      animation: none;
    }

    .gift.open .gift-lid {
      animation: lidOpen 1.05s 1.15s cubic-bezier(.2,.7,.2,1) forwards;
    }

    .gift.open .gift-bow {
      animation: bowLift .8s 1.05s ease-out forwards;
    }

    .gift.open .gift-ribbon {
      animation: ribbonDrop .9s 1.1s ease-out forwards;
    }

    .gift.open .gift-knot {
      animation: knotLift .75s 1.05s ease-out forwards;
    }

    .sparkle {
      position: absolute;
      z-index: 1;
      color: #b99556;
      font-family: Georgia, serif;
      font-size: 22px;
      opacity: 0;
      text-shadow: 0 0 10px rgba(220,190,130,.5);
    }

    .s1 { top: 18%; left: 17%; }
    .s2 { top: 26%; right: 16%; font-size: 17px; }
    .s3 { top: 56%; left: 12%; font-size: 15px; }
    .s4 { top: 59%; right: 13%; font-size: 24px; }
    .s5 { top: 39%; right: 10%; font-size: 12px; }
    .s6 { top: 43%; left: 10%; font-size: 13px; }

    .confetti {
      position: absolute;
      top: -20px;
      z-index: 1;
      width: 5px;
      height: 10px;
      background: linear-gradient(180deg, #e8d5a8, #b89250);
      opacity: 0;
      pointer-events: none;
    }

    .confetti:nth-of-type(2n) {
      width: 3px;
      height: 7px;
      background: #f3e5c4;
    }

    .opening-message {
      margin-top: 8px;
      color: #8e7142;
      font-size: 13px;
      letter-spacing: 2px;
      opacity: 0;
    }

    .opening-sub {
      margin-top: 11px;
      color: #a19786;
      font-size: 11px;
      letter-spacing: 1px;
      opacity: 0;
    }

    #opening.active .opening-brand {
      animation: fadeIn .7s .1s forwards;
    }

    #opening.active .opening-title {
      animation: fadeIn .7s .35s forwards;
    }

    #opening.active .gift-glow {
      animation: glowIn 1.5s .45s ease-out forwards;
    }

    #opening.active .gift {
      animation: giftArrive .8s .25s ease-out both;
    }

    #opening.active .gift.open {
      animation: none;
    }

    #opening.active .gift-shadow {
      animation: shadowIn 1s .3s forwards;
    }

    #opening.active .gift.open ~ .sparkle {
      animation: sparkleIn 1.05s 1.4s ease-out forwards;
    }

    #opening.active .opening-message {
      animation: riseIn .8s 2s forwards;
    }

    #opening.active .opening-sub {
      animation: fadeIn .8s 2.4s forwards;
    }

    #opening.active .confetti {
      animation: confettiFall 2.1s 1.45s ease-in forwards;
    }

    #opening.active .c1 { left: 10%; }
    #opening.active .c2 { left: 21%; animation-delay: 1.7s; }
    #opening.active .c3 { left: 34%; animation-delay: 1.55s; }
    #opening.active .c4 { left: 47%; animation-delay: 1.9s; }
    #opening.active .c5 { left: 59%; animation-delay: 1.65s; }
    #opening.active .c6 { left: 72%; animation-delay: 1.8s; }
    #opening.active .c7 { left: 85%; animation-delay: 1.5s; }
    #opening.active .c8 { left: 94%; animation-delay: 2s; }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes glowIn {
      0% { opacity: 0; transform: scale(.65); }
      100% { opacity: 1; transform: scale(1.12); }
    }

    @keyframes giftArrive {
      0% { opacity: 0; transform: translateY(12px) scale(.9); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes giftFloat {
      0%, 100% { transform: translateY(0) rotateY(-3deg); }
      50% { transform: translateY(-5px) rotateY(3deg); }
    }

    @keyframes shadowIn {
      to { opacity: .7; }
    }

    @keyframes lidOpen {
      0% { transform: translate(0,0) rotate(0); }
      100% { transform: translate(-12px,-48px) rotate(-28deg); }
    }

    @keyframes bowLift {
      to { transform: translateY(-34px) rotate(-12deg); opacity: .22; }
    }

    @keyframes ribbonDrop {
      0% { transform: translateY(0) rotate(0); }
      100% { transform: translateY(40px) rotate(14deg); opacity: .35; }
    }

    @keyframes knotLift {
      to { transform: translateY(-24px) rotate(45deg); opacity: .3; }
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes sparkleIn {
      0% { opacity: 0; transform: scale(.4) rotate(-25deg); }
      45% { opacity: 1; transform: scale(1.2) rotate(15deg); }
      100% { opacity: .55; transform: scale(1) rotate(0); }
    }

    @keyframes confettiFall {
      0% { opacity: 0; transform: translateY(-10px) rotate(0); }
      12% { opacity: .85; }
      100% { opacity: 0; transform: translateY(105vh) rotate(500deg); }
    }

    @media (max-width: 380px) {
      main { padding: 30px 19px 25px; }
      h1 { font-size: 21px; }
      .gift-scene { transform: scale(.88); margin: 0 auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      #opening.active *,
      #opening.active *::before,
      #opening.active *::after {
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">Re:QREATOR</div>
    <div class="anniversary">5TH ANNIVERSARY</div>
    <div class="number-five" aria-hidden="true">5</div>
    <h1>5周年記念プレゼント抽選</h1>

    <p class="intro">
      いつもご利用いただき、ありがとうございます。<br>
      5年間の感謝を込めて、プレゼントをご用意しました。<br>
      ぜひ抽選にご参加ください。
    </p>

    <div class="divider"></div>

    <form
      id="drawForm"
      method="post"
      action="https://script.google.com/macros/s/AKfycbzCvXCrrRVTd9asGKntuhjfCd3qCXJtXPXNLRivMoAwRhEh_zyv3RV1ixGsd4JuBxylmg/exec"
    >
      <label for="memberName">会員名</label>

      <input
        type="text"
        name="memberName"
        id="memberName"
        maxlength="80"
        autocomplete="name"
        placeholder="例：山田 花子"
        required
      >

      <input type="hidden" name="idToken" id="idToken">

      <button id="drawButton" type="submit" disabled>
        LINE認証中…
      </button>
    </form>

    <p id="status" aria-live="polite">
      LINEの認証を確認しています。
    </p>

    <p class="note">
      ※抽選はお一人様1回限りです。同じLINEアカウントで再アクセスした場合は、初回の抽選結果を表示します。
    </p>
  </main>

  <section id="opening" aria-hidden="true">
    <span class="sparkle s1">✧</span>
    <span class="sparkle s2">✦</span>
    <span class="sparkle s3">✧</span>
    <span class="sparkle s4">✦</span>
    <span class="sparkle s5">✧</span>
    <span class="sparkle s6">✦</span>

    <i class="confetti c1"></i>
    <i class="confetti c2"></i>
    <i class="confetti c3"></i>
    <i class="confetti c4"></i>
    <i class="confetti c5"></i>
    <i class="confetti c6"></i>
    <i class="confetti c7"></i>
    <i class="confetti c8"></i>

    <div class="opening-content">
      <div class="opening-brand">Re:QREATOR</div>
      <div class="opening-title">5TH ANNIVERSARY</div>

      <div class="gift-scene">
        <div class="gift-glow"></div>
        <div class="gift-shadow"></div>

        <div class="gift" id="giftBox">
          <div class="gift-body">
            <div class="gift-side-highlight"></div>
          </div>
          <div class="gift-ribbon"></div>
          <div class="gift-lid"></div>
          <div class="gift-bow"></div>
          <div class="gift-knot"></div>
        </div>
      </div>

      <div class="opening-message">感謝を込めた贈りもの</div>
      <div class="opening-sub">あなたへのプレゼントをお届けします</div>
    </div>
  </section>

  <script>
    const LIFF_ID = "1656435814-rLbpktXX";

    const form = document.getElementById("drawForm");
    const memberNameInput = document.getElementById("memberName");
    const button = document.getElementById("drawButton");
    const status = document.getElementById("status");
    const idTokenInput = document.getElementById("idToken");
    const opening = document.getElementById("opening");
    const giftBox = document.getElementById("giftBox");

    let initializing = false;
    let submitting = false;
    let loggedIn = false;

    async function start() {
      if (initializing) return;
      initializing = true;

      try {
        if (typeof liff === "undefined") {
          throw new Error("LINEの認証プログラムを読み込めませんでした。");
        }

        status.textContent = "LINEとの接続を確認しています。";
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          status.textContent = "LINEログインが必要です。";
          button.textContent = "LINEでログイン";
          button.disabled = false;
          return;
        }

        loggedIn = true;
        status.textContent =
          "LINEとの接続が完了しました。会員名を入力してください。";
        button.textContent = "抽選する";
        button.disabled = false;

      } catch (error) {
        console.error("LIFF initialization error:", error);
        status.textContent =
          "LINEとの接続に失敗しました。LINE公式の抽選リンクから開き直してください。";
        button.textContent = "再接続する";
        button.disabled = false;
      } finally {
        initializing = false;
      }
    }

    button.addEventListener("click", function(event) {
      if (loggedIn) return;

      event.preventDefault();

      if (typeof liff !== "undefined") {
        try {
          liff.login();
        } catch (error) {
          console.error("LIFF login error:", error);
          status.textContent =
            "ログインを開始できませんでした。ページを開き直してください。";
        }
      } else {
        window.location.reload();
      }
    });

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (submitting) return;

      const memberName = memberNameInput.value.trim();

      if (!memberName) {
        status.textContent = "会員名を入力してください。";
        memberNameInput.focus();
        return;
      }

      try {
        if (typeof liff === "undefined" || !liff.isLoggedIn()) {
          status.textContent = "LINEログインが必要です。";
          button.textContent = "LINEでログイン";
          button.disabled = false;
          loggedIn = false;
          return;
        }

        const token = liff.getIDToken();

        if (!token) {
          throw new Error(
            "LINEの認証情報を取得できませんでした。抽選リンクから開き直してください。"
          );
        }

        idTokenInput.value = token;
        memberNameInput.value = memberName;

        submitting = true;
        button.disabled = true;
        button.textContent = "プレゼントを準備しています…";
        status.textContent = "感謝を込めたプレゼントを準備しています。";

        opening.classList.add("active");
        opening.setAttribute("aria-hidden", "false");

        /*
         * ギフトボックスが開く演出を見せてから送信します。
         * 実際の抽選・重複判定・景品管理はGoogle Apps Script側で行います。
         */
        giftBox.classList.add("open");

        const reducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;

        const animationDuration = reducedMotion ? 500 : 3600;

        window.setTimeout(function() {
          /*
           * HTMLFormElement.submit()を明示的に呼び出し、
           * 送信処理がボタン要素によって上書きされないようにします。
           */
          HTMLFormElement.prototype.submit.call(form);
        }, animationDuration);

      } catch (error) {
        console.error("Draw submission error:", error);
        status.textContent =
          error && error.message
            ? error.message
            : "処理に失敗しました。";

        submitting = false;
        button.disabled = false;
        button.textContent = "もう一度試す";
        opening.classList.remove("active");
        opening.setAttribute("aria-hidden", "true");
      }
    });

    start();
  </script>
</body>
</html>
