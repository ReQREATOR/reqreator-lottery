
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f4eb">
  <title>Re:QREATOR 5周年記念プレゼント抽選</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --ivory: #f8f4eb;
      --paper: #fffdf8;
      --gold: #c6a76b;
      --gold-light: #f2e4c2;
      --gold-dark: #92713e;
      --ink: #393126;
      --muted: #817667;
      --border: #e5d7bc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px 36px;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background:
        radial-gradient(ellipse at 50% 0%, #fffefa 0%, transparent 65%),
        linear-gradient(145deg, #f8f4eb, #f0e7d6);
    }

    main {
      position: relative;
      max-width: 460px;
      margin: 18px auto;
      padding: 35px 25px 28px;
      overflow: hidden;
      text-align: center;
      background: rgba(255,253,248,.97);
      border: 1px solid var(--border);
      border-radius: 3px;
      box-shadow: 0 14px 40px rgba(89,68,35,.09);
    }

    main::before {
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(198,167,107,.28);
      content: "";
      pointer-events: none;
    }

    main > * { position: relative; }

    .brand {
      color: #77613e;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
      letter-spacing: 4px;
    }

    .anniversary {
      margin-top: 25px;
      color: var(--gold-dark);
      font-family: Georgia, serif;
      font-size: 11px;
      letter-spacing: 4px;
    }

    .number-five {
      margin: 4px 0 -3px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(78px, 20vw, 108px);
      font-weight: 400;
      line-height: 1.08;
      background: linear-gradient(
        125deg,
        #987442 0%,
        #e6d09d 23%,
        #b28b4d 44%,
        #f0e2bc 59%,
        #9c7740 82%,
        #d9bd82 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(1px 2px 0 rgba(177,140,75,.12));
    }

    h1 {
      margin: 10px 0 21px;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 2px;
    }

    .intro { font-size: 13px; line-height: 2; }

    .divider {
      width: 46px;
      height: 1px;
      margin: 23px auto;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    label {
      display: block;
      margin: 25px 0 9px;
      text-align: left;
      font-size: 14px;
      font-weight: 600;
    }

    input[type="text"] {
      display: block;
      width: 100%;
      min-height: 50px;
      padding: 12px;
      border: 1px solid #d9cbb4;
      border-radius: 2px;
      background: #fff;
      color: var(--ink);
      font-size: 16px;
      appearance: none;
    }

    input[type="text"]:focus {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    button {
      display: block;
      width: 100%;
      min-height: 54px;
      margin-top: 22px;
      padding: 13px;
      border: 1px solid #a88a54;
      border-radius: 2px;
      background: linear-gradient(
        110deg, #40372a 0%, #665137 50%, #40372a 100%
      );
      color: #fffdf8;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow:
        0 5px 13px rgba(74,54,26,.13),
        inset 0 1px 0 rgba(255,255,255,.15);
      transition: opacity .2s, transform .2s;
    }

    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .58; cursor: not-allowed; }

    #status {
      margin-top: 17px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .note {
      margin-top: 24px;
      color: #81796e;
      font-size: 11px;
      line-height: 1.9;
      text-align: left;
    }

    /* 開封演出の全画面 */
    #opening {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      padding: 20px;
      overflow: hidden;
      background:
        radial-gradient(
          ellipse at 50% 38%,
          #fffefa 0%,
          #f8f1e2 55%,
          #ecdfc7 100%
        );
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .45s ease, visibility .45s ease;
    }

    #opening.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #opening::before,
    #opening::after {
      position: absolute;
      content: "";
      pointer-events: none;
    }

    #opening::before {
      inset: 15px;
      border: 1px solid rgba(183,147,84,.28);
    }

    #opening::after {
      inset: 22px;
      border: 1px solid rgba(183,147,84,.12);
    }

    .opening-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      text-align: center;
    }

    .opening-brand,
    .opening-title,
    .opening-message,
    .opening-sub {
      opacity: 0;
    }

    .opening-brand {
      color: #76603d;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      letter-spacing: 4px;
    }

    .opening-title {
      margin-top: 15px;
      color: #9c7a45;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 11px;
      letter-spacing: 4px;
    }

    .gift-scene {
      position: relative;
      display: grid;
      width: 280px;
      height: 280px;
      margin: 10px auto 0;
      place-items: center;
      perspective: 1000px;
    }

    .gift-glow {
      position: absolute;
      width: 205px;
      height: 205px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255,253,232,.96) 0%,
        rgba(235,210,158,.55) 23%,
        rgba(235,210,158,.18) 48%,
        transparent 73%
      );
      opacity: .32;
      transform: scale(.8);
    }

    .gift-flare {
      position: absolute;
      z-index: 1;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255,255,245,.98) 0%,
        rgba(255,237,186,.7) 24%,
        rgba(233,196,117,.2) 55%,
        transparent 72%
      );
      opacity: 0;
      transform: scale(.15);
      pointer-events: none;
    }

    .rays {
      position: absolute;
      z-index: 1;
      width: 230px;
      height: 230px;
      opacity: 0;
      transform: scale(.7);
      pointer-events: none;
    }

    .rays i {
      position: absolute;
      left: 50%;
      bottom: 50%;
      width: 1px;
      height: 76px;
      transform-origin: 50% 100%;
      background: linear-gradient(
        to top, transparent, rgba(193,151,73,.42), rgba(255,253,232,.88)
      );
    }

    .rays i:nth-child(1) { transform: rotate(-72deg); height: 55px; }
    .rays i:nth-child(2) { transform: rotate(-51deg); height: 85px; }
    .rays i:nth-child(3) { transform: rotate(-28deg); height: 66px; }
    .rays i:nth-child(4) { transform: rotate(-8deg); height: 96px; }
    .rays i:nth-child(5) { transform: rotate(17deg); height: 75px; }
    .rays i:nth-child(6) { transform: rotate(39deg); height: 91px; }
    .rays i:nth-child(7) { transform: rotate(63deg); height: 65px; }
    .rays i:nth-child(8) { transform: rotate(83deg); height: 48px; }

    .dust {
      position: absolute;
      z-index: 4;
      inset: 0;
      pointer-events: none;
    }

    .dust i {
      position: absolute;
      top: 52%;
      left: 50%;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #d5b36b;
      box-shadow: 0 0 6px rgba(213,179,107,.7);
      opacity: 0;
    }

    .dust i:nth-child(1) { --x:-86px; --y:-72px; }
    .dust i:nth-child(2) { --x:76px; --y:-80px; }
    .dust i:nth-child(3) { --x:-105px; --y:-15px; }
    .dust i:nth-child(4) { --x:103px; --y:-20px; }
    .dust i:nth-child(5) { --x:-59px; --y:52px; }
    .dust i:nth-child(6) { --x:63px; --y:48px; }
    .dust i:nth-child(7) { --x:-16px; --y:-103px; }
    .dust i:nth-child(8) { --x:19px; --y:82px; }

    .gift-shadow {
      position: absolute;
      left: 50%;
      bottom: 31px;
      width: 165px;
      height: 20px;
      border-radius: 50%;
      background: rgba(83,61,31,.18);
      filter: blur(11px);
      transform: translateX(-50%);
      opacity: 0;
    }

    .gift {
      position: relative;
      z-index: 2;
      width: 166px;
      height: 150px;
      margin-top: 22px;
      transform-style: preserve-3d;
    }

    .gift-body {
      position: absolute;
      left: 8px;
      bottom: 0;
      width: 150px;
      height: 98px;
      overflow: hidden;
      border: 1px solid #cbb58a;
      background: linear-gradient(
        110deg, #d9c59e 0%, #fff7e4 22%, #f0e2c3 52%, #d7c095 100%
      );
      box-shadow:
        inset 7px 0 10px rgba(255,255,255,.32),
        inset -8px 0 10px rgba(111,79,34,.08),
        0 12px 22px rgba(137,104,49,.12);
    }

    .gift-body::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 63px;
      width: 24px;
      border-right: 1px solid rgba(151,111,52,.25);
      border-left: 1px solid rgba(255,255,255,.6);
      background: linear-gradient(
        90deg, #b28a49, #f8ebcb 40%, #d1b071 78%, #b28a49
      );
      content: "";
    }

    .gift-body::after {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 9px;
      background: linear-gradient(180deg, rgba(255,255,255,.45), transparent);
      content: "";
    }

    .gift-side-highlight {
      position: absolute;
      inset: 0 auto 0 25px;
      width: 18px;
      background: linear-gradient(
        90deg, transparent, rgba(255,255,255,.38), transparent
      );
    }

    .gift-lid {
      position: absolute;
      z-index: 4;
      top: 25px;
      left: 0;
      width: 166px;
      height: 30px;
      border: 1px solid #c7ad77;
      background: linear-gradient(
        105deg, #d7bf8e 0%, #fff5dc 25%, #e9d5aa 61%, #c5a267 100%
      );
      box-shadow:
        0 5px 8px rgba(91,66,30,.13),
        inset 0 2px 3px rgba(255,255,255,.65);
      transform-origin: 12% 100%;
    }

    .gift-lid::before {
      position: absolute;
      inset: 2px 0 auto;
      height: 1px;
      background: rgba(255,255,255,.65);
      content: "";
    }

    .gift-lid::after {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 70px;
      width: 24px;
      border-right: 1px solid rgba(151,111,52,.25);
      border-left: 1px solid rgba(255,255,255,.6);
      background: linear-gradient(
        90deg, #b28a49, #f8ebcb 40%, #d1b071 78%, #b28a49
      );
      content: "";
    }

    .gift-ribbon {
      position: absolute;
      z-index: 5;
      top: 0;
      left: 71px;
      width: 24px;
      height: 150px;
      border-right: 1px solid rgba(151,111,52,.22);
      border-left: 1px solid rgba(255,255,255,.6);
      background: linear-gradient(
        90deg, #ad8547, #f9ebc9 38%, #d7b576 75%, #ad8547
      );
      transform-origin: 50% 24%;
    }

    .gift-bow {
      position: absolute;
      z-index: 6;
      top: -6px;
      left: 56px;
      width: 54px;
      height: 29px;
      transform-origin: 50% 100%;
    }

    .gift-bow::before,
    .gift-bow::after {
      position: absolute;
      top: 0;
      width: 29px;
      height: 21px;
      border: 1px solid #ae8546;
      background: linear-gradient(
        135deg, #fff0cf 0%, #e2c58c 55%, #bd9658 100%
      );
      box-shadow: inset 2px 2px 3px rgba(255,255,255,.65);
      content: "";
    }

    .gift-bow::before {
      left: 0;
      border-radius: 85% 15% 70% 25%;
      transform: rotate(22deg);
    }

    .gift-bow::after {
      right: 0;
      border-radius: 15% 85% 25% 70%;
      transform: scaleX(-1) rotate(22deg);
    }

    .gift-knot {
      position: absolute;
      z-index: 7;
      top: 5px;
      left: 77px;
      width: 13px;
      height: 13px;
      border: 1px solid #ad8546;
      border-radius: 3px;
      background: linear-gradient(135deg, #fff0cc, #c19a5b);
      box-shadow: 0 1px 3px rgba(94,68,31,.15);
      transform: rotate(45deg);
    }

    .gift.open .gift-lid {
      animation: lidOpen 1.15s 1.05s cubic-bezier(.2,.7,.2,1) forwards;
    }

    .gift.open .gift-bow {
      animation: bowLift .72s .92s ease-in forwards;
    }

    .gift.open .gift-ribbon {
      animation: ribbonDrop .85s .98s ease-out forwards;
    }

    .gift.open .gift-knot {
      animation: knotLift .7s .92s ease-in forwards;
    }

    .opening-message {
      margin-top: 0;
      color: #8e7142;
      font-size: 13px;
      letter-spacing: 2px;
    }

    .opening-sub {
      margin-top: 11px;
      color: #a19786;
      font-size: 11px;
      letter-spacing: 1px;
    }

    #opening.active .opening-brand { animation: fadeIn .7s .08s forwards; }
    #opening.active .opening-title { animation: fadeIn .7s .25s forwards; }
    #opening.active .gift { animation: giftArrive .8s .12s ease-out both; }
    #opening.active .gift-shadow { animation: shadowIn .8s .2s forwards; }
    #opening.active .gift-glow { animation: glowPulse 2.4s .35s ease-in-out infinite alternate; }
    #opening.active .gift.open ~ .gift-flare { animation: flare 2s 1.8s ease-out both; }
    #opening.active .rays { animation: raysExpand 1.7s 1.85s ease-out both; }
    #opening.active .dust i { animation: dustFloat 1.8s 1.85s ease-out both; }
    #opening.active .opening-message { animation: riseIn .8s 2.2s forwards; }
    #opening.active .opening-sub { animation: fadeIn .8s 2.55s forwards; }

    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes giftArrive {
      from { opacity: 0; transform: translateY(12px) scale(.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes shadowIn { to { opacity: .75; } }
    @keyframes glowPulse {
      from { opacity: .25; transform: scale(.82); }
      to { opacity: .58; transform: scale(1.08); }
    }
    @keyframes lidOpen {
      0% { transform: translate(0,0) rotate(0); }
      100% { transform: translate(-12px,-45px) rotate(-28deg); }
    }
    @keyframes bowLift {
      to { transform: translateY(-26px) rotate(-12deg); opacity: 0; }
    }
    @keyframes ribbonDrop {
      0% { transform: translateY(0) rotate(0); opacity: 1; }
      100% { transform: translateY(35px) rotate(12deg); opacity: 0; }
    }
    @keyframes knotLift {
      to { transform: translateY(-22px) rotate(45deg); opacity: 0; }
    }
    @keyframes flare {
      0% { opacity: 0; transform: scale(.15); }
      28% { opacity: 1; transform: scale(1.7); }
      62% { opacity: .65; transform: scale(2.7); }
      100% { opacity: 0; transform: scale(3.5); }
    }
    @keyframes raysExpand {
      0% { opacity: 0; transform: scale(.55); }
      35% { opacity: .8; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.17); }
    }
    @keyframes dustFloat {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(.4); }
      25% { opacity: .8; }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.65);
      }
    }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 380px) {
      main { padding: 30px 19px 25px; }
      h1 { font-size: 21px; }
      .gift-scene { transform: scale(.88); margin-top: -5px; margin-bottom: -5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #opening.active *, #opening.active *::before, #opening.active *::after {
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
      }
      #opening.active .gift.open .gift-lid {
        transform: translate(-12px,-45px) rotate(-28deg);
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">Re:QREATOR</div>
    <div class="anniversary">5TH ANNIVERSARY</div>
    <div class="number-five" aria-hidden="true">5</div>
    <h1>5周年記念プレゼント抽選</h1>

    <p class="intro">
      いつもご利用いただき、ありがとうございます。<br>
      5年間の感謝を込めて、プレゼントをご用意しました。<br>
      ぜひ抽選にご参加ください。
    </p>

    <div class="divider"></div>

    <form
      id="drawForm"
      method="post"
      action="https://script.google.com/macros/s/AKfycbzCvXCrrRVTd9asGKntuhjfCd3qCXJtXPXNLRivMoAwRhEh_zyv3RV1ixGsd4JuBxylmg/exec"
    >
      <label for="memberName">会員名</label>
      <input
        type="text"
        name="memberName"
        id="memberName"
        maxlength="80"
        autocomplete="name"
        placeholder="例：山田 花子"
        required
      >
      <input type="hidden" name="idToken" id="idToken">
      <button id="drawButton" type="submit" disabled>LINE認証中…</button>
    </form>

    <p id="status" aria-live="polite">LINEの認証を確認しています。</p>

    <p class="note">
      ※抽選はお一人様1回限りです。同じLINEアカウントで再アクセスした場合は、初回の抽選結果を表示します。
    </p>
  </main>

  <section id="opening" aria-hidden="true" aria-label="プレゼントの開封演出">
    <div class="opening-content">
      <div class="opening-brand">Re:QREATOR</div>
      <div class="opening-title">5TH ANNIVERSARY</div>

      <div class="gift-scene" aria-hidden="true">
        <div class="gift-glow"></div>
        <div class="gift-shadow"></div>

        <div class="gift" id="giftBox">
          <div class="gift-body">
            <div class="gift-side-highlight"></div>
          </div>
          <div class="gift-ribbon"></div>
          <div class="gift-lid"></div>
          <div class="gift-bow"></div>
          <div class="gift-knot"></div>
        </div>

        <div class="gift-flare"></div>
        <div class="rays">
          <i></i><i></i><i></i><i></i>
          <i></i><i></i><i></i><i></i>
        </div>
        <div class="dust">
          <i></i><i></i><i></i><i></i>
          <i></i><i></i><i></i><i></i>
        </div>
      </div>

      <div class="opening-message">感謝を込めた贈りもの</div>
      <div class="opening-sub">あなたへのプレゼントをお届けします</div>
    </div>
  </section>

  <script>
    const LIFF_ID = "1656435814-rLbpktXX";

    const form = document.getElementById("drawForm");
    const memberNameInput = document.getElementById("memberName");
    const button = document.getElementById("drawButton");
    const status = document.getElementById("status");
    const idTokenInput = document.getElementById("idToken");
    const opening = document.getElementById("opening");
    const giftBox = document.getElementById("giftBox");

    let initializing = false;
    let submitting = false;
    let loggedIn = false;

    async function start() {
      if (initializing) return;
      initializing = true;

      try {
        if (typeof liff === "undefined") {
          throw new Error("LINEの認証プログラムを読み込めませんでした。");
        }

        status.textContent = "LINEとの接続を確認しています。";
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          status.textContent = "LINEログインが必要です。ボタンを押してログインしてください。";
          button.textContent = "LINEでログイン";
          button.disabled = false;
          loggedIn = false;
          return;
        }

        loggedIn = true;
        status.textContent = "会員名を入力してください。<br>※2026年11月時点でプラン契約をされている会員様のみご参加頂けます。";
        button.textContent = "抽選する";
        button.disabled = false;

      } catch (error) {
        console.error("LIFF initialization error:", error);
        status.textContent = "LINEとの接続に失敗しました。LINE公式の抽選リンクから開き直してください。";
        button.textContent = "再接続する";
        button.disabled = false;

      } finally {
        initializing = false;
      }
    }

    button.addEventListener("click", function(event) {
      if (loggedIn) return;

      event.preventDefault();

      if (typeof liff !== "undefined") {
        try {
          liff.login({ redirectUri: window.location.href });
        } catch (error) {
          console.error("LIFF login error:", error);
          status.textContent = "ログインを開始できませんでした。ページを開き直してください。";
        }
      } else {
        window.location.reload();
      }
    });

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      if (submitting) return;

      const memberName = memberNameInput.value.trim();

      if (!memberName) {
        status.textContent = "会員名を入力してください。";
        memberNameInput.focus();
        return;
      }

      if (!loggedIn || typeof liff === "undefined" || !liff.isLoggedIn()) {
        status.textContent = "LINEログインが必要です。";
        button.textContent = "LINEでログイン";
        button.disabled = false;
        loggedIn = false;
        return;
      }

      try {
        const token = liff.getIDToken();

        if (!token) {
          throw new Error("LINEの認証情報を取得できませんでした。抽選リンクから開き直してください。");
        }

        idTokenInput.value = token;
        memberNameInput.value = memberName;

        submitting = true;
        button.disabled = true;
        button.textContent = "プレゼントを準備しています…";
        status.textContent = "感謝を込めたプレゼントを準備しています。";

        opening.classList.add("active");
        opening.setAttribute("aria-hidden", "false");
        giftBox.classList.add("open");

        const reducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;

        const animationDuration = reducedMotion ? 900 : 4100;

        window.setTimeout(function() {
          HTMLFormElement.prototype.submit.call(form);
        }, animationDuration);

      } catch (error) {
        console.error("Draw submission error:", error);
        status.textContent = error && error.message
          ? error.message
          : "処理に失敗しました。";

        submitting = false;
        button.disabled = false;
        button.textContent = "もう一度試す";
        opening.classList.remove("active");
        opening.setAttribute("aria-hidden", "true");
        giftBox.classList.remove("open");
      }
    });

    start();
  </script>
</body>
</html>
