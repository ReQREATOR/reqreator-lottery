  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      background: #f7f5f0;
      color: #292929;
      font-family: sans-serif;
    }

    main {
      max-width: 440px;
      margin: 30px auto;
      padding: 30px 22px;
      background: #fff;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    .brand {
      color: #b87832;
      font-size: 13px;
      letter-spacing: 3px;
    }

    h1 {
      margin: 22px 0;
      font-size: 23px;
    }

    p { line-height: 1.8; }

    label {
      display: block;
      margin: 24px 0 8px;
      text-align: left;
      font-size: 15px;
      font-weight: bold;
    }

    input[type="text"] {
      display: block;
      width: 100%;
      min-height: 50px;
      padding: 12px;
      border: 1px solid #b8ad9b;
      border-radius: 8px;
      background: #fff;
      color: #292929;
      font-size: 16px;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="text"]:focus {
      outline: 2px solid #b87832;
      outline-offset: 2px;
    }

    button {
      display: block;
      width: 100%;
      min-height: 52px;
      margin-top: 22px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #b87832;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .note {
      margin-top: 18px;
      color: #666;
      font-size: 12px;
      text-align: left;
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">Re:QREATOR</div>

    <h1>プレゼント抽選</h1>

    <p>会員名を入力して、抽選にご参加ください。</p>

    <form
      id="drawForm"
      method="post"

    >
      <label for="memberName">会員名</label>

      <input
        type="text"
        name="memberName"
        id="memberName"
        maxlength="80"
        autocomplete="name"
        placeholder="例：山田 花子"
        required
      >

      <input type="hidden" name="idToken" id="idToken">

      <button id="drawButton" type="submit" disabled>
        LINE認証中…
      </button>
    </form>

    <p id="status" aria-live="polite">
      LINEの認証を確認しています。
    </p>

    <p class="note">
      ※抽選はお一人様1回限りです。同じLINEアカウントで再アクセスした場合は、初回の抽選結果を表示します。
    </p>
  </main>
